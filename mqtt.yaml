sensor:
  # === Outdoor Sensor ===
  - name: "Outdoor Temperature"
    state_topic: "tele/zbbridge/SENSOR"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    value_template: "{{ ((value_json.ZbReceived | default({}))['0x5FCD'] | default({})).Temperature | default('') }}"
    availability_topic: "tele/zbbridge/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"

  - name: "Outdoor Humidity"
    state_topic: "tele/zbbridge/SENSOR"
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    value_template: "{{ ((value_json.ZbReceived | default({}))['0x5FCD'] | default({})).Humidity | default('') }}"
    availability_topic: "tele/zbbridge/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"

  - name: "Outside Temp Battery"
