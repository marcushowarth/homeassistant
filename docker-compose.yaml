services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      - TZ=Europe/London
    volumes:
      - /home/hauser:/config
      - /run/dbus:/run/dbus:ro
    depends_on:
      - mosquitto
      - mariadb

  mariadb:
    container_name: mariadb
    image: mariadb:11.4
    restart: unless-stopped
    ports:
      - 3307:3306
    environment:
      - TZ=Europe/London
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_DATABASE=homeassistant
      - MARIADB_USER=hass
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
    volumes:
      - /home/hauser/mariadb/data:/var/lib/mysql

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:latest
    restart: unless-stopped
    ports:
      - 1883:1883
    volumes:
      - /home/hauser/mosquitto/config:/mosquitto/config
      - /home/hauser/mosquitto/data:/mosquitto/data
      - /home/hauser/mosquitto/log:/mosquitto/log

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt:latest
    restart: unless-stopped
    devices:
      - /dev/serial/by-id/usb-Itead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_V2_fea8eda44a4eef11804750b3174bec31-if00-port0:/dev/ttyUSB0
    ports:
      - 8080:8080
    environment:
      - TZ=Europe/London
    volumes:
      - /home/hauser/zigbee2mqtt-data:/app/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - mosquitto

  plex:
    container_name: plex
    image: plexinc/pms-docker:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/London
      - PLEX_UID=1000
      - PLEX_GID=1000
    volumes:
      - /home/hauser/plex/config:/config
      - /home/hauser/plex/transcode:/transcode
      - /mnt/nas-videos:/media/movies:ro
      - /mnt/nas-tv:/media/tv:ro
      - /mnt/nas-music:/media/music:ro
      - /mnt/nas-music-byartist:/media/music-byartist:ro
      - /mnt/nas-music-compilations:/media/music-compilations:ro

  # Predbat battery planner - SANDBOXED read-only trial (kanban #1061)
  # apps.yaml routes all controls to input_*.predbat_sandbox_* helpers, never the inverter
  predbat:
    container_name: predbat
    image: nipar44/predbat_addon:latest
    restart: unless-stopped
    network_mode: host
    # Wait for HA to answer before starting Predbat: after a reboot Docker starts
    # every container at once (depends_on is ignored then), and Predbat doesn't
    # retry its HA connection (#1091). Only Predbat waits; HA never waits on it.
    entrypoint: ["sh", "-c", 'until python3 -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8123/manifest.json'', timeout=3)" 2>/dev/null; do echo "predbat: waiting for Home Assistant"; sleep 5; done; exec sh /addon/run.standalone.sh']
    environment:
      - TZ=Europe/London
    volumes:
      - /home/hauser/predbat:/config:rw
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - homeassistant
